<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
    <title>資訊三甲 黃子於 九九乘法表</title>
<style>
table, th, td {
  border: 1px solid rgb(194, 176, 190);
  border-collapse: collapse;
}

th, td {
  background-color: #539bde;
}
</style>

<script>
    document.write("<h1> 資訊三甲 黃子於 九九乘法表 </h1>");
    document.write("<table align='center'>");
    for (let i = 1; i <= 9; i++) {
        document.write("<tr>");
        for (let j = 1; j <= i ; j++) {
            document.write("<td>");
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
            document.write("</td>");
        }
        document.write("</tr>");
    }
    document.write("</table>");
</script>

</head>

<body>
    <h2>資訊三甲 黃子於 九九乘法表 </h2>
</body>
</html>
